<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Site</title>

  <!-- OneSignal Web Push SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function (OneSignal) {
      await OneSignal.init({
        appId: "PASTE-YOUR-ONESIGNAL-APP-ID-HERE",
        notifyButton: { enable: true }, // bell icon so visitors can subscribe
      });
    });
  </script>

  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>Welcome</h1>
  <p>Tap the bell icon at the bottom of the screen and choose Allow to get notifications.</p>
</body>
</html>
